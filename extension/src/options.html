<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>apted settings</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      body { padding: 24px; max-width: 560px; }
      form { display: flex; flex-direction: column; gap: 14px; }
      label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
      .hint { color: var(--muted); font-size: 11px; }
      .actions { display: flex; gap: 8px; align-items: center; }
      h1 { font-size: 18px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <h1>apted settings</h1>
    <form id="form">
      <label>
        Auth token
        <input id="authToken" placeholder="paste your extension token here" />
        <span class="hint">Sign in to the apted web app, open Settings &rarr; Extension Access, copy the token, and paste it here. Sent as <code>Authorization: Bearer &lt;token&gt;</code> on every API call. Optional when the server runs without auth (local mode).</span>
      </label>
      <label style="flex-direction: row; align-items: center; gap: 8px;">
        <input id="openModeWindow" type="checkbox" style="width: auto;" />
        <span style="color: var(--text);">Open as detached window</span>
      </label>
      <span class="hint" style="margin-top: -10px;">
        Recommended for Arc, which doesn't render the toolbar popup reliably. In Chrome, leave this off for the anchored popover.
      </span>
      <div class="actions">
        <button id="save" class="primary" type="submit">Save</button>
        <span id="status" class="hint" aria-live="polite"></span>
      </div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
